<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive two-player Tic-Tac-Toe game.">
  <title>Tic-Tac-Toe | Two Player Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="game-card" aria-labelledby="game-title">
      <header class="game-header">
        <p class="eyebrow">CLASSIC TWO-PLAYER GAME</p>
        <h1 id="game-title">Tic-Tac-Toe</h1>
        <p class="subtitle">Take turns. Make your move. Get three in a row.</p>
      </header>
      <div class="players" aria-label="Player scores">
        <div class="player active" id="player-x">
          <span class="player-symbol">X</span>
          <span class="player-details"><strong>Player X</strong><small id="score-x">Wins: 0</small></span>
        </div>
        <div class="player" id="player-o">
          <span class="player-symbol">O</span>
          <span class="player-details"><strong>Player O</strong><small id="score-o">Wins: 0</small></span>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">Player X's turn</div>
      <div class="board" id="board" role="group" aria-label="Tic-Tac-Toe board">
        <button class="cell" type="button" data-index="0" aria-label="Row 1, column 1"></button>
        <button class="cell" type="button" data-index="1" aria-label="Row 1, column 2"></button>
        <button class="cell" type="button" data-index="2" aria-label="Row 1, column 3"></button>
        <button class="cell" type="button" data-index="3" aria-label="Row 2, column 1"></button>
        <button class="cell" type="button" data-index="4" aria-label="Row 2, column 2"></button>
        <button class="cell" type="button" data-index="5" aria-label="Row 2, column 3"></button>
        <button class="cell" type="button" data-index="6" aria-label="Row 3, column 1"></button>
        <button class="cell" type="button" data-index="7" aria-label="Row 3, column 2"></button>
        <button class="cell" type="button" data-index="8" aria-label="Row 3, column 3"></button>
      </div>
      <div class="actions">
        <button class="button button-primary" id="restart" type="button">Restart Game</button>
        <button class="button button-secondary" id="reset-scores" type="button">Reset Scores</button>
      </div>
      <footer class="game-footer">
        <span><span class="legend-x">X</span> Player One</span>
        <span class="footer-dot">•</span>
        <span><span class="legend-o">O</span> Player Two</span>
      </footer>
    </section>
    <p class="page-note">Made with HTML, CSS &amp; JavaScript</p>
  </main>
</body>
</html>
